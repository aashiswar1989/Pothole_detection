name: CICD pipeline for Pothole Detection Project

on:
  push:
    branches: [ "main" ]

  pull_request:
    branches: [ "main" ]


jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v5

    - name: Set up Python 3.11
      uses: actions/setup-python@v3
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest
        pip install -r requirements_dev.txt
        # if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    # - name: Test with pytest
    #   run: |
    #     pytest

  docker-build:
    needs: build
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v5

    - name: Login to Docker
      uses: docker/login-action@v3
      with:
            username: ${{secrets.DOCKER_USERNAME}}
            password: ${{secrets.DOCKER_PASSWORD}}

    - name: Setup buildx
      uses: docker/setup-buildx-action@v3

    - name: Build image and push 
      uses: docker/build-push-action@v6
      with:
            context .
            push: true
            tags: ${{secrets.DOCKER_USERNAME}}/pothole-detector:latest
            cache-from: type=registry, ref=${{secrets.DOCKER_USERNAME}}/pothole-detector:cache
            cache-to: type=registry, ref = ${{secrets.DOCKER_USERNAME}}/pothole-detector:cache, mode=max